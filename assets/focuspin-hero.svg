<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="530" viewBox="0 0 1280 530" role="img" aria-labelledby="t d">
<title id="t">focuspin. — your tasks, softly in sight.</title><desc id="d">A minimal ivory and dusty-rose desktop task manager with soft note overlay.</desc>
<defs>
